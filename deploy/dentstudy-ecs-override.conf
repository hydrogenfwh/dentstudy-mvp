[Service]
WorkingDirectory=/opt/dentstudy-current/backend
Environment=DENTSTUDY_BANK=/opt/dentstudy-current/mobile/assets/all_questions.json
Environment=DENTSTUDY_SUBMISSIONS=/var/lib/dentstudy/question-bank-submissions
Environment=DENTSTUDY_ADMIN_EMAIL=dentstudy1126@aka.yeah.net
# Payment is deliberately narrower than administration. Leave the immutable
# user ID unset until the owner has registered this mailbox and it has been
# verified in the production database; absent either setting payment fails
# closed for every account.
Environment=DENTSTUDY_PAYMENT_AUTHOR_EMAIL=dentstudy1126@aka.yeah.net
# Environment=DENTSTUDY_PAYMENT_AUTHOR_USER_ID=<users.id after author registration>
# Kept outside Git and readable only by root. The leading '-' lets the service
# run normally until the owner has completed official merchant onboarding.
EnvironmentFile=-/etc/dentstudy/dentstudy-payments.env
# Only production opts into the 2026-10-18 one-time learning-history reset.
Environment=DENTSTUDY_LEARNING_RECORDS_RESET_AT=2026-10-18T13:43:15.000000Z
ExecStart=
ExecStart=/opt/dentstudy-venv/bin/python /opt/dentstudy-current/backend/server.py --host 127.0.0.1 --port 8787
